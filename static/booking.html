<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
  <title>台北一日遊｜預定行程</title>
</head>
<body class="booking-page-body">
  <header class="navigation">
    <nav class="navbar" aria-label="主要導覽">
      <a class="logo" href="/" aria-label="台北一日遊首頁">台北一日遊</a>
      <ul class="navigation-links">
        <li><a class="btn-for-navigation" href="/booking">預定行程</a></li>
        <li><button class="btn-for-navigation" id="member-button" type="button" aria-haspopup="dialog">登入／註冊</button></li>
      </ul>
    </nav>
  </header>

  <main class="booking-main">
    <h1 class="booking-greeting">您好，<span id="booking-member-name"></span>，待預訂的行程如下：</h1>

    <p class="booking-empty" id="booking-empty">目前沒有任何待預訂的行程</p>

    <!-- 取得行程後，移除 hidden、隱藏空行程訊息，並在 body 加上 has-booking。 -->
    <form class="booking-content" id="booking-content" hidden>
      <section class="booking-trip" aria-label="預定行程內容">
        <img class="booking-trip-image" id="booking-attraction-image" alt="預定景點">
        <div class="booking-trip-details">
          <h2>台北一日遊：<span id="booking-attraction-name">平安鐘</span></h2>
          <dl class="booking-trip-list">
            <div><dt>日期：</dt><dd id="booking-date-display">2021-04-23</dd></div>
            <div><dt>時間：</dt><dd id="booking-time-display">早上 9 點到下午 4 點</dd></div>
            <div><dt>費用：</dt><dd>新台幣 <span id="booking-price-display">2000</span> 元</dd></div>
            <div><dt>地點：</dt><dd id="booking-address">臺北市 大安區忠孝東路4段</dd></div>
          </dl>
        </div>
        <button class="booking-delete" id="booking-delete" type="button" aria-label="刪除預定行程">
          <span class="booking-delete-icon" aria-hidden="true"></span>
        </button>
      </section>

      <section class="booking-form-section" aria-labelledby="contact-title">
        <div class="booking-form-inner">
          <h2 id="contact-title">您的聯絡資訊</h2>
          <div class="booking-form-row">
            <label for="contact-name">聯絡姓名：</label>
            <input id="contact-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="booking-form-row">
            <label for="contact-email">連絡信箱：</label>
            <input id="contact-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="booking-form-row">
            <label for="contact-phone">手機號碼：</label>
            <input id="contact-phone" name="phone" type="tel" autocomplete="tel" required>
          </div>
          <p class="booking-form-notice">請保持手機暢通，準時到達，導覽人員將用手機與您聯繫，務必留下正確的聯絡方式。</p>
        </div>
      </section>

      <section class="booking-form-section booking-payment" aria-labelledby="payment-title">
        <div class="booking-form-inner">
          <h2 id="payment-title">信用卡付款資訊</h2>
          <div class="booking-form-row">
            <label for="card-number">卡片號碼：</label>
            <input id="card-number" name="card-number" type="text" inputmode="numeric" placeholder="**** **** **** ****" autocomplete="cc-number">
          </div>
          <div class="booking-form-row">
            <label for="card-expiration">過期時間：</label>
            <input id="card-expiration" name="card-expiration" type="text" inputmode="numeric" placeholder="MM / YY" autocomplete="cc-exp">
          </div>
          <div class="booking-form-row">
            <label for="card-cvv">驗證密碼：</label>
            <input id="card-cvv" name="card-cvv" type="text" inputmode="numeric" placeholder="CVV" autocomplete="cc-csc">
          </div>
        </div>
      </section>

      <section class="booking-checkout" aria-label="確認付款">
        <p>總價：新台幣 <span id="booking-total-price">2000</span> 元</p>
        <button class="booking-checkout-button" id="booking-checkout-button" type="submit">確認訂購並付款</button>
      </section>
    </form>
  </main>

  <footer class="footer">
    <p class="footer-text">COPYRIGHT © 2021 台北一日遊</p>
  </footer>

  <section class="dialog dialog-signin" aria-hidden="true" aria-labelledby="signin-title">
    <div class="backdrop"></div>
    <div class="dialog-panel" role="dialog" aria-modal="true">
      <div class="decorator-bar"></div>
      <button class="dialog-close" id="signin-close" type="button" aria-label="關閉登入視窗"><img src="/static/images/icon_close.png" alt=""></button>
      <div class="dialog-main">
        <h2 class="signin-title" id="signin-title">登入會員帳號</h2>
        <form class="dialog-form" id="signin-form">
          <label class="sr-only" for="signin-email">電子信箱</label>
          <input type="email" class="input-for-dialog" id="signin-email" name="email" placeholder="輸入電子信箱" autocomplete="email" required>
          <label class="sr-only" for="signin-password">密碼</label>
          <input type="password" class="input-for-dialog" id="signin-password" name="password" placeholder="輸入密碼" autocomplete="current-password" required>
          <button class="button-for-dialog" id="signin-button" type="submit">登入帳戶</button>
        </form>
        <p class="dialog-message" id="signin-message" aria-live="polite" hidden></p>
        <button class="dialog-switch signin-signup-text" type="button">還沒有帳戶？點此註冊</button>
      </div>
    </div>
  </section>

  <section class="dialog dialog-signup" aria-hidden="true" aria-labelledby="signup-title">
    <div class="backdrop"></div>
    <div class="dialog-panel" role="dialog" aria-modal="true">
      <div class="decorator-bar"></div>
      <button class="dialog-close" id="signup-close" type="button" aria-label="關閉註冊視窗"><img src="/static/images/icon_close.png" alt=""></button>
      <div class="dialog-main">
        <h2 class="signin-title" id="signup-title">註冊會員帳號</h2>
        <form class="dialog-form" id="signup-form">
          <label class="sr-only" for="signup-name">姓名</label>
          <input type="text" class="input-for-dialog" id="signup-name" name="name" placeholder="輸入姓名" autocomplete="name" required>
          <label class="sr-only" for="signup-email">電子信箱</label>
          <input type="email" class="input-for-dialog" id="signup-email" name="email" placeholder="輸入電子信箱" autocomplete="email" required>
          <label class="sr-only" for="signup-password">密碼</label>
          <input type="password" class="input-for-dialog" id="signup-password" name="password" placeholder="輸入密碼" autocomplete="new-password" required>
          <button class="button-for-dialog" id="signup-button" type="submit">註冊新帳戶</button>
        </form>
        <p class="dialog-message" id="signup-message" aria-live="polite" hidden></p>
        <button class="dialog-switch signup-signin-text" type="button">已經有帳戶了？點此登入</button>
      </div>
    </div>
  </section>

  <script src="/static/user_auth.js" defer></script>
  <script src="/static/booking.js" defer></script>
</body>
</html>
