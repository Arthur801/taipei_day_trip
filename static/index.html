<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index</title>
</head>
<body>
  <nav class="navigation">
    <div class="navbar">
      <div class="logo">台北一日遊</div>
      <ul class="container">
        <li>
          <button class="btn-for-navigation">預定行程</button>
        </li>
        <li>
          <button class="btn-for-navigation">登入/註冊</button>
        </li>
      </ul>
    </div>
  </nav>
  <div class="hero-section">
    <img src="../images/welcome image.png" alt="welcome image">
  </div>
  <div class="hero-content">
    <div>
      <div class="slogan">
        <div class="big-slogan">輕鬆享受台北一日悠閒</div>
        <div class="small-slogan">探索每個角落，體驗城市的深度旅遊行程</div>
        <div class="search">
          <div class="search-bar">
            <form class="Search-bar">
              <select class="selector">
                <option>全部分類 ▼</option>
              </select>
              <input type="search" id="attraction-search" placeholder="輸入景點名稱查詢">
              <button class="search-btn" id="attraction-search-btn"><img src="../images/icon_search.png" alt="icon/search"></button>
            </form>
            <div class="category-menu">

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="attraction-section">
    <div class="list-bar">
      <div class="left-container">
        <button id="button-arrow-left"><img src="../images/Button_Arrow_left.png" alt="button / arrow left"></button>
      </div>
      <div class="container">
        <ul listItem-container>

        </ul>
      </div>
      <div class="right-container">
        <button id="button-arrow-right"><img src="../images/Button_Arrow_right.png" alt="button / arrow right"></button>
      </div>
    </div>
    <div class="attractions">
      <div class="attractions-group">

      </div>
    </div>
  </div>
  <div class="footer">
    <div class="footer-text">COPYRIGHT © 2021 台北一日遊</div>
  </div>
  <div class="dialog">
    <div class="dialog-signin">
      <div class="decorator-bar"></div>
      <button id="signin-close"><img src="../images/icon_close.png" alt="icon / close"></button>
    </div>
    <div class="main">
      <div class="signin-title">登入會員帳號</div>
      <div class="container">
        <input type="email" class="input-for-dialog" id="signin-email" placeholder="輸入電子信箱">
        <input type="password" class="input-for-dialog" id="signin-password" placeholder="輸入密碼">
        <div class="button-for-dialog">
          <button id="signin-button">登入帳戶</button>
        </div>
        <a class="signin-signup-text">還沒有帳戶？點此註冊</div>
      </div>
    </div>
    <div class="backdrop"></div>
  </div>
  <div class="dialog">
    <div class="dialog-signup">
      <div class="decorator-bar"></div>
      <button id="signup-close"><img src="../images/icon_close.png" alt="icon / close"></button>
    </div>
    <div class="main">
      <div class="signin-title">註冊會員帳號</div>
      <div class="container">
        <input type="text" class="input-for-dialog" id="signup-email" placeholder="輸入姓名">
        <input type="email" class="input-for-dialog" id="signup-email" placeholder="輸入電子信箱">
        <input type="password" class="input-for-dialog" id="signup-password" placeholder="輸入密碼">
        <div class="button-for-dialog">
          <button id="signin-button">註冊新帳戶</button>
        </div>
        <a class="signup-signin-text">已經有帳戶了？點此登入</div>
      </div>
    </div>
    <div class="backdrop"></div>
  </div>
</body>
</html>
